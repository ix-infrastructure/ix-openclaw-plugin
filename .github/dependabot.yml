version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Toolchain majors need a deliberate, tested migration, not an auto-bump.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # hono and @hono/node-server reach us only as transitive deps of the
      # `openclaw` devDependency, which ships its own npm-shrinkwrap.json. npm
      # honors a dependency's shrinkwrap over our `overrides`, so no root-level
      # change can move them -- note the blocker is the shrinkwrap freeze, NOT
      # the declaring range: @modelcontextprotocol/sdk asks for hono ^4.11.4,
      # which the patched 4.12.34 satisfies. (@hono/node-server is different:
      # patched 2.0.5 genuinely violates the sdk's ^1.19.9.) Dependabot reports
      # fix_available:false and its security-update job exits 1 on every run.
      #
      # WARNING: a bare `ignore` (no update-types) is shield-check scoped, so it
      # suppresses Dependabot SECURITY-update PRs for these packages too, not
      # just version bumps. The alerts themselves stay visible under Security,
      # and that tab is now the ONLY signal for them -- no PR will be raised
      # even once a fix becomes reachable. That is the deliberate trade for a
      # permanently red lane, but it is a real cost.
      #
      # REMOVE both entries once the freeze lifts. The likeliest trigger is not
      # upstream re-pinning hono, but the 2026.8 line going stable: 2026.8.1-beta.1
      # ships NO npm-shrinkwrap.json at all, so ordinary resolution and
      # `overrides` start working again there.
      - dependency-name: "hono"
      - dependency-name: "@hono/node-server"
      # body-parser is the one alert this pin makes WORSE, and it is disclosed
      # rather than hidden: extended-stable's shrinkwrap freezes it at 2.2.2
      # where `latest` had 2.3.0, so GHSA-v422-hmwv-36x6 (low) reopens as alert
      # #89. Same freeze, same fix_available:false, so leaving it unignored just
      # returns the security lane to permanently red for a low-severity issue in
      # a dev tree that never executes. Net effect of the pin is still 18 open
      # alerts -> 8, with all 5 highs cleared. Same shield-check caveat as above.
      - dependency-name: "body-parser"
      # openclaw is deliberately held at the extended-stable line (2026.6.34 --
      # published 2026-08-04, i.e. a maintained backport NEWER than `latest`),
      # whose shrinkwrap carries patched undici/ip-address/fast-uri. The 2026.7.x
      # releases regressed those pins, so an auto-bump here would silently reopen
      # 11 alerts, 5 of them high. `latest` is also a prerelease (2026.7.1-2) that
      # does not satisfy our own peerDependency `openclaw: ">=2026.5.17"`.
      #
      # Scoped to version-updates ONLY, deliberately: a bare ignore here would
      # also suppress security-update PRs for openclaw itself, so a direct CVE in
      # openclaw would raise no PR and go unnoticed until someone read the
      # Security tab. update-types is version-scoped, leaving that lane intact.
      #
      # semver-patch is deliberately NOT ignored, so the extended-stable line
      # keeps flowing. openclaw is calver, so from 2026.6.34 a patch bump is
      # 2026.6.35 -- another backport on the same line -- while 2026.7.x is
      # semver-minor and 2027.x is semver-major, both still blocked. That line
      # ships regularly (2026.6.33 on 2026-07-21, 2026.6.34 on 2026-08-04, the
      # latter being the release that carries the patched pins), so ignoring
      # patches would freeze out exactly the updates we want. There is no
      # Dependabot auto-merge workflow in this repo, so a 2026.6.35 bump arrives
      # as a reviewable PR, not an automatic one -- which is also the trip-wire
      # for revisiting the pin, rather than relying on someone remembering to.
      - dependency-name: "openclaw"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
